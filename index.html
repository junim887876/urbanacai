<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-id="th-modified">Urban Açaí</title>
    
    <!-- Configurações PWA e Favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta name="theme-color" content="#4b0082">

    <!-- Suporte e otimização para iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Urban Açaí">
    <link rel="apple-touch-icon" href="logo.jpg">

    <!-- Dependências Externas -->
    <script src="https://cdn.tailwindcss.com/"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-text {
            background: linear-gradient(90deg, #4b0082, #800080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-purple-gradient {
            background: linear-gradient(135deg, #4b0082 0%, #2a004d 100%);
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-shadow:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .complement-checkbox:checked + label {
            background-color: #f3e8ff; 
            border-color: #9333ea; 
            color: #4c1d95; 
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-top: env(safe-area-inset-top);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 16px 24px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: visibility 0s, opacity 0.3s linear, bottom 0.3s ease-out;
            opacity: 0;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: 90vw;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 90px;
        }
        
        .drawer-open {
            transform: translateY(0%) !important;
        }
        .overlay-open {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .pb-safe {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="text-gray-800 antialiased relative min-h-screen pb-32">

    <!-- Header -->
    <header class="glass-header fixed w-full top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-gradient flex items-center justify-center text-white font-bold text-xl overflow-hidden">
                    <img src="logo.jpg" alt="Logo Urban Açaí" class="w-full h-full object-cover" onerror="this.outerHTML='<i class=\'fa-solid fa-bowl-food\'></i>'">
                </div>
                <h1 class="text-2xl font-bold gradient-text tracking-tight">Urban Açaí</h1>
            </div>
            <div class="text-sm font-medium text-gray-500 hidden sm:block">
                O melhor açaí da região
            </div>
        </div>
    </header>

    <!-- Hero Section -->

        <div class="bg-purple-gradient rounded-3xl p-8 sm:p-12 text-white relative overflow-hidden shadow-2xl mb-6">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-purple-500 opacity-20 rounded-full blur-3xl"></div>
            
            <div class="relative z-10 max-w-lg">
                <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold tracking-wider mb-4 border border-white/30 backdrop-blur-sm">PROMOÇÃO ESPECIAL</span>
                <h2 class="text-3xl sm:text-5xl font-bold mb-4 leading-tight">Monte o seu copo perfeito.</h2>
                <p class="text-purple-100 mb-2 text-lg">Compre 2 ou mais copos de 500ml e pague apenas <span class="font-bold text-yellow-300">R$ 25,00 cada!</span></p>
                <p class="text-sm text-purple-200"><i class="fa-solid fa-circle-info"></i> Quer sabores diferentes? Adicione um por vez ao carrinho e o desconto será aplicado automaticamente no final.</p>
            </div>
        </div>

    <!-- Toast Notification -->
    <div id="toast">
        <i class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-message">Item adicionado com sucesso!</span>

    <!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker registrado com sucesso no escopo:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('Falha ao registrar o Service Worker:', err);
                    });
            });
        }
    </script>
